name: Autonomous Agent Swarm Dispatch

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 2:00 AM UTC
  workflow_dispatch:
    inputs:
      role:
        description: 'Agent Role to Dispatch'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - security
          - tests
          - docs
      target:
        description: 'Target Repository (owner/repo)'
        required: true
        default: 'Pat333-ux/autonomous-governance-core'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  dispatch-swarm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Swarm Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Swarm Dispatcher
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TARWATER_KILL_SWITCH: "false"
        run: |
          python swarm_dispatcher.py --role ${{ github.event.inputs.role || 'all' }} --target "${{ github.event.inputs.target || 'Pat333-ux/autonomous-governance-core' }}"
